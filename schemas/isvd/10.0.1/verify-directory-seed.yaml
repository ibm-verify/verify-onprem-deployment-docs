---
"$schema": http://json-schema.org/draft-07/schema#
"$ref": "#/definitions/VerifyDirectorySeed"
title: "IBM Verify Directory: Seed"
description: >
  This page documents the YAML schema which can be used to configure
  a Verify Directory Seed container for version 10.0.1. <br><br>
  The Verify Directory Seed container is used for data migration and replication setup.
  <br><br>
  The value of each YAML key entry can be provided in the YAML file as either
  plain text, base-64 encoded text (prefix: 'B64:'), retrieved from an 
  environment variable (prefix: '$'), loaded from a local file (prefix: '@'),
  retrieved from a Kubernetes secret (format: secret:{name}/{field}), or 
  retrieved from a Kubernetes ConfigMap (format: configmap:{name}/{field}). 
  <br><br>
  In addition to this, each of the YAML keys can also be provided as an
  environment variable, using a normalized value of the key name as the
  environment variable name.

examples:
  - { "general": { "license": { "key": "insert-license-key-here", "accept": "standard" }, "key-stash": "insert-key-stash-here", "admin": { "pwd": "passw0rd1" } }, "seed": { "migrate": { "suffixes": [ "o=sample" ] } } }
  - { "general": { "license": { "key": "insert-license-key-here", "accept": "standard" } } }

definitions:
  VerifyDirectorySeed:
    type: object
    properties:
      general:
        "$ref": "#/definitions/general"
      seed:
        "$ref": "#/definitions/seed"
    required:
    - general
    title: VerifyDirectorySeed

  general:
    description: >
      The general configuration elements of the container.
    type: object
    properties:
      admin:
        type: object
        description: >
          The credential information of the server.
        properties:
          pwd:
            type: string
            description: >
              The password of the user which can be used to authenticate to the server.
        required:
        - pwd
      key-stash:
        type: string
        description: >
          The contents of the key stash file (.ksf) which is used to protect
          data.  This file should be provided if cryptographic synchronisation
          is required between different servers.  The key stash can either be 
          obtained from a software based directory server installation, or a 
          new one can be generated by starting this image with the 'keystash' 
          argument.  For example:
          'docker run --rm icr.io/isvd/verify-directory-seed:latest keystash'.
          Please note that this will send a base-64 encoded version of the
          key stash to the console of the container.
      license:
        type: object
        description: >
          License configuration for the seed container.
        properties:
          key:
            type: string
            description: >
              The license key, required to run the container.
          accept:
            type: string
            description: >
              Which license agreement has been accepted, either 'limited' or
              'standard' or 'enterprise'.
            enum:
            - limited
            - standard
            - enterprise
        required:
        - key
        - accept
    required:
    - license

  seed:
    description: >
      The configuration entries associated with the seed container operations.
    type: object
    properties:
      migrate:
        type: object
        description: >
          Configuration for migrating data from an existing instance into a containerized environment.
        properties:
          suffixes:
            type: array
            description: >
              The suffixes to migrate from the existing instance.
            items:
              type: string
              description: >
                A suffix DN to migrate (e.g., 'o=sample', 'dc=ibm,dc=com').

